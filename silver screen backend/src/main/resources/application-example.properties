spring.application.name=silver-screen

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/silver_screen}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_LOCAL_MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}