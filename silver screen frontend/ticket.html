<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Silver Screen | Ticket</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <h1>THE SILVER SCREEN</h1>
        <nav>
    <a href="index.html">Home</a>
    <a href="mybookings.html">My Bookings</a>
</nav>
    </header>


    <main class="ticket-page">

        <div class="ticket">

            <div class="ticket-logo">
                THE SILVER SCREEN
            </div>


            <div class="ticket-header">
                <h2>MOVIE TICKET</h2>
            
            </div>
        

            <div class="ticket-details">

                <div class="ticket-row">
                    <span>Movie</span>
                    <strong id="ticket-movie">-</strong>
                </div>

                <div class="ticket-row">
                    <span>Date</span>
                    <strong id="ticket-date">-</strong>
                </div>

                <div class="ticket-row">
                    <span>Showtime</span>
                    <strong id="ticket-time">-</strong>
                </div>


                <div class="ticket-row">
                    <span>Seats</span>
                    <strong id="ticket-seats">-</strong>
                </div>


                <div class="ticket-row">
                    <span>Tickets</span>
                    <strong id="ticket-count">-</strong>
                </div>


                <div class="ticket-row total-row">
                    <span>Total</span>
                    <strong id="ticket-total">₹0</strong>
                </div>

            </div>


            <div class="booking-id">
                Booking ID:
                <strong id="booking-id">-</strong>
            </div>


            <div class="confirmed">
                ✓ BOOKING CONFIRMED
            </div>
        <div class="ticket-tail">
                <h3>Another Blockbuster awaits!</h3>
            </div>

        </div>
    
    </main>


    <script src="script.js"></script>

</body>

</html>
